name: comic_viewer
description: "Offline-first comic reader for locally stored comic PDFs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2719.3
  shared_preferences: ^2.3.2
  sqflite: ^2.3.0
  path: ^1.8.0
  pdfx: ^2.6.0
  watcher: ^1.1.0
  wakelock_plus: ^1.2.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/or_logo.png"
  adaptive_icon_background: "#0B1326"
  adaptive_icon_foreground: "assets/images/or_logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
