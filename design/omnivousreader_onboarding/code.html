<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Area -->
<main class="flex-1 flex flex-col h-screen overflow-hidden relative">
<!-- Hero Illustration Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-60 mix-blend-screen" data-alt="A highly detailed, cinematic comic art illustration featuring dynamic characters and vibrant, glowing action sequences. The style is reminiscent of high-end graphic novels, utilizing deep shadows and intense, vivid color accents against a dark, moody background. The scene exudes high-octane energy and immersive storytelling, perfectly suited for a premium digital comic reader interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDbEGX1Q9cGZYwTGQ95etdgjRvbByRzQnu01V8dFX6JJOgxtgV0rkbMyUWmgIsoBx_AOmjCxY_eBIbJSGLqB753LSo_u9SSCg3YrblUE5tYaPvhUldZ4Z_3WNfs0-nyvD2cuRVYSUyvR4xrcyD75ZbpxrcQ5TUD8QgYZTCcMj9SbDLciUK1Ohqi4oLWeRpDxRWGNc633Dmi4ZrKkK0nUjRTVgIRzlVwgCqmrIhw2nyxlICN3cc2jUrcBnYLmLXIgB4I8eTu16YbhA0"/>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-b from-background/10 via-background/60 to-background z-10"></div>
</div>
<!-- Content Overlay -->
<div class="relative z-20 flex flex-col justify-end h-full px-lg pb-xl pt-safe-margin max-w-md mx-auto w-full">
<div class="flex flex-col gap-sm mb-lg transform transition-all duration-700 translate-y-0 opacity-100" id="onboarding-text">
<!-- Branding/Icon (Optional context) -->
<div class="mb-sm flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-high border border-outline-variant/30 shadow-lg shadow-indigo-900/20">
<span class="material-symbols-outlined text-primary text-title-lg" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface text-balance drop-shadow-md">
                    Your Entire Collection, Anywhere.
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">
                    Seamlessly read and organize your favorite comics with a pro-grade scrollable reader.
                </p>
</div>
<!-- Call to Action -->
<div class="w-full">
<button class="w-full bg-[#6366f1] hover:bg-primary-container text-white hover:text-on-primary-container font-title-lg text-title-lg py-md px-lg rounded-full shadow-xl shadow-indigo-900/30 transition-all duration-300 ease-out transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-sm group">
                    Get Started
                    <span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
<!-- Safe area bottom padding space -->
<div class="h-safe-margin w-full"></div>
</div>
</main>
<!-- Navigation Shells are suppressed for onboarding intent -->
<script>
        // Simple entrance animation for text
        document.addEventListener("DOMContentLoaded", () => {
            const textContent = document.getElementById('onboarding-text');
            // Adding a slight delay to ensure it feels like an entrance
            setTimeout(() => {
                textContent.style.opacity = '1';
                textContent.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
