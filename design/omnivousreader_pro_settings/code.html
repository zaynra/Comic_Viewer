<style>
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #c0c1ff; /* primary */
            cursor: pointer;
            margin-top: -8px; 
            box-shadow: 0 0 10px rgba(192, 193, 255, 0.3);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #2d3449; /* surface-variant */
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        input[type=range]:focus {
            outline: none;
        }
        
        /* Material Switch Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #c0c1ff; /* primary */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #c0c1ff; /* primary */
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: white;
            background-color: #1000a9; /* on-primary */
        }
        
        .settings-panel {
            background: #171f33; /* surface-container */
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .section-divider {
            border-bottom: 1px solid #2d3449; /* surface-variant */
        }
      </style>

</div>

<!-- Drag Handle -->
<div class="w-full pt-sm pb-md flex justify-center cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-lg pb-xl overflow-y-auto custom-scrollbar flex flex-col">
<!-- Header -->

<div class="flex flex-col">
<h2 class="font-headline-md text-headline-md text-on-surface">Lumina Reader</h2>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mt-xs">Settings</span>
</div>
<button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors">

</button>
</div>
