<script>
        // Simple tap to toggle UI visibility
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('reader-canvas');
            const uiOverlay = document.getElementById('ui-overlay');
            let uiVisible = true;

            canvas.addEventListener('click', (e) => {
                // Don't toggle if clicking on interactive elements (though currently canvas is behind pointer-events-none overlay)
                uiVisible = !uiVisible;
                if (uiVisible) {
                    uiOverlay.classList.remove('opacity-0');
                } else {
                    uiOverlay.classList.add('opacity-0');
                }
            });
        });
    </script>
