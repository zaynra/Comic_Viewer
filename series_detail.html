<script>
        // Simple touch feedback for rows
        document.querySelectorAll('.rounded-comic').forEach(el => {
            el.addEventListener('mousedown', () => el.classList.add('active-overlay'));
            el.addEventListener('mouseup', () => el.classList.remove('active-overlay'));
            el.addEventListener('mouseleave', () => el.classList.remove('active-overlay'));
            el.addEventListener('touchstart', () => el.classList.add('active-overlay'));
            el.addEventListener('touchend', () => el.classList.remove('active-overlay'));
        });
    </script>
